name: AyuGram macOS arm64

on:
  workflow_dispatch:
  push:
    branches: [codex/ayu-7.2.5]
    paths-ignore: ['**.md', 'LICENSE', 'LEGAL']

permissions:
  contents: read

concurrency:
  group: ayugram-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release arm64
    runs-on: macos-15
    env:
      REPO_NAME: AyuGramDesktop
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Clone sources
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: Install build tools
        id: toolchain
        run: |
          brew install automake libtool meson nasm ninja pkg-config ccache
          sudo xcode-select -s "$DEVELOPER_DIR"
          toolchain_id=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; cmake --version; } | shasum -a 256 | cut -c1-16)
          echo "id=$toolchain_id" >> "$GITHUB_OUTPUT"

      - name: Restore libraries cache
        id: libraries-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-arm64-release-${{ steps.toolchain.outputs.id }}-${{ hashFiles('AyuGramDesktop/Telegram/build/prepare/**', 'AyuGramDesktop/Telegram/build/qt_version.py') }}
          restore-keys: |
            macos-arm64-release-${{ steps.toolchain.outputs.id }}-
            macos-arm64-libs-8e4440f51857fcdfd3aa84bc0eec3a9171915790dfbfd59d3d3f31730a1e2b91

      - name: Prepare libraries
        run: ./"$REPO_NAME"/Telegram/build/prepare/mac.sh silent

      - name: Free disk space
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Save libraries cache
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.libraries-cache.outputs.cache-primary-key }}

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-arm64-release-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: ccache-arm64-release-${{ steps.toolchain.outputs.id }}-

      - name: Configure AyuGram
        working-directory: ${{ env.REPO_NAME }}/Telegram
        run: |
          ./configure.sh -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D DESKTOP_APP_MAC_ARCH=arm64 \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -D CMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -D 'CMAKE_CXX_FLAGS=-Xclang -fno-pch-timestamp' \
            -D 'CMAKE_OBJCXX_FLAGS=-Xclang -fno-pch-timestamp' \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
          python3 build/check_macos_release.py ../out

      - name: Build AyuGram
        working-directory: ${{ env.REPO_NAME }}
        run: |
          cmake --build out --parallel 3 --target Telegram
          ccache --show-stats

      - name: Save compiler cache
        if: always() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Verify and package app
        working-directory: ${{ env.REPO_NAME }}/out
        run: |
          app=AyuGram.app
          test -s "$app/Contents/Resources/AppIcon-Default.icns"
          test -s "$app/Contents/Resources/Telegram.rcc"
          test "$(lipo -archs "$app/Contents/MacOS/AyuGram")" = arm64
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = one.ayugram.OvironDesktop
          icon_name=$(plutil -extract CFBundleIconFile raw -o - "$app/Contents/Info.plist")
          test -s "$app/Contents/Resources/$icon_name"
          /usr/bin/strip -S "$app/Contents/MacOS/AyuGram"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/AyuGram" > AyuGram-7.2.5-architecture.txt
          git rev-parse HEAD > AyuGram-7.2.5-source.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" AyuGram-7.2.5-macOS-arm64.zip
          shasum -a 256 AyuGram-7.2.5-macOS-arm64.zip > AyuGram-7.2.5-macOS-arm64.zip.sha256

      - name: Upload AyuGram
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-7.2.5-macOS-arm64-Release
          path: |
            ${{ env.REPO_NAME }}/out/AyuGram-7.2.5-macOS-arm64.zip
            ${{ env.REPO_NAME }}/out/AyuGram-7.2.5-macOS-arm64.zip.sha256
            ${{ env.REPO_NAME }}/out/AyuGram-7.2.5-architecture.txt
            ${{ env.REPO_NAME }}/out/AyuGram-7.2.5-source.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
