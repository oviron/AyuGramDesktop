name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release branch to build, for example codex/ayu-7.2.8
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release head
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      version: ${{ steps.head.outputs.version }}
      publish: ${{ steps.head.outputs.publish }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Caches are scoped to the ref a run starts on, and only the default
          # branch is readable from every other branch.
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
      - name: Validate application credentials
        env:
          TDESKTOP_API_ID: ${{ vars.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [[ ! "$TDESKTOP_API_ID" =~ ^[1-9][0-9]*$ || ! "$TDESKTOP_API_HASH" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo 'Set TDESKTOP_API_ID and TDESKTOP_API_HASH in repository Actions settings.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match source version and release ref
        id: head
        env:
          REF: ${{ inputs.ref }}
        run: |
          version=$(awk '$1 == "AppVersionStr" { print $2 }' Telegram/build/version)
          test "$REF" = "codex/ayu-$version"
          test "$(awk '$1 == "AppVersionOriginal" { print $2 }' Telegram/build/version)" = "$version"
          test "$(awk '$1 == "BetaChannel" { print $2 }' Telegram/build/version)" = 0
          test "$(awk '$1 == "AlphaVersion" { print $2 }' Telegram/build/version)" = 0
          test ! -d Telegram/Resources/ayu/languages
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # An already tagged version still builds, so the pipeline can be
          # exercised and a failed release retried; only publishing is skipped.
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Tag \`v$version\` exists, so this run builds without publishing." >> "$GITHUB_STEP_SUMMARY"
          fi

  source:
    name: Full source archive
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Archive source and pinned submodules
        run: |
          root="AyuGramDesktop-$VERSION"
          archive="$RUNNER_TEMP/$root-full.tar"
          git archive --format=tar --prefix="$root/" HEAD -o "$archive"
          while read -r revision path rest; do
            revision="${revision#[-+U]}"
            test "$(git -C "$path" rev-parse HEAD)" = "$revision"
            part="$RUNNER_TEMP/submodule-$(printf '%s' "$path" | sha256sum | cut -c1-16).tar"
            git -C "$path" archive --format=tar --prefix="$root/$path/" "$revision" -o "$part"
            tar --concatenate --file="$archive" "$part"
          done < <(git submodule status --recursive)
          gzip -9 -n "$archive"
          mkdir artifacts
          mv "$archive.gz" "artifacts/AyuGramDesktop-$VERSION-full.tar.gz"
          tar -tzf "artifacts/AyuGramDesktop-$VERSION-full.tar.gz" > "$RUNNER_TEMP/source-files.txt"
          grep -qx "$root/Telegram/build/version" "$RUNNER_TEMP/source-files.txt"
          ! grep -q "$root/Telegram/Resources/ayu/languages/" "$RUNNER_TEMP/source-files.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: artifacts/AyuGramDesktop-${{ needs.validate.outputs.version }}-full.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos-build:
    name: macOS ${{ matrix.architecture }} Release
    needs: validate
    runs-on: macos-15
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            swift_target: arm64-apple-macos11.0
          - architecture: x86_64
            swift_target: x86_64-apple-macos10.13
    env:
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          submodules: recursive
          path: AyuGramDesktop
          persist-credentials: false
      - name: Install build tools
        id: toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          brew install automake libtool meson nasm ninja pkg-config wget ccache
          sudo xcode-select -s "$DEVELOPER_DIR"
          echo "id=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore libraries cache
        id: libraries-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-universal-release-${{ steps.toolchain.outputs.id }}-${{ hashFiles('AyuGramDesktop/Telegram/build/prepare/**', 'AyuGramDesktop/Telegram/build/qt_version.py') }}
          restore-keys: macos-universal-release-${{ steps.toolchain.outputs.id }}-
      - name: Prepare libraries
        run: |
          ./AyuGramDesktop/Telegram/build/prepare/mac.sh silent qt-release-only
          find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete
      - name: Save libraries cache
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.libraries-cache.outputs.cache-primary-key }}
      - name: Drop superseded libraries caches
        continue-on-error: true
        env:
          KEEP: |
            ${{ steps.libraries-cache.outputs.cache-primary-key }}
          PREFIXES: macos-universal-release-
        run: |
          # Kept under ten gigabytes by deleting what each save superseded,
          # right after that save rather than at the end of the job.
          for prefix in $PREFIXES; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json key --jq '.[].key' |
              grep -vxF "$KEEP" | while read -r key; do gh cache delete --repo "$GITHUB_REPOSITORY" "$key"; done || true
          done
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-macos-${{ matrix.architecture }}-release-${{ needs.validate.outputs.sha }}
          restore-keys: ccache-macos-${{ matrix.architecture }}-release-
      - name: Build ${{ matrix.architecture }} Release
        working-directory: AyuGramDesktop/Telegram
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          SWIFT_TARGET: ${{ matrix.swift_target }}
          TDESKTOP_API_ID: ${{ vars.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          ccache --zero-stats > /dev/null
          sysctl -n hw.ncpu hw.memsize
          export CMAKE_BUILD_TYPE=Release
          rm -rf ../out
          ./configure.sh -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "-DCMAKE_OSX_ARCHITECTURES=$ARCHITECTURE" \
            "-DCMAKE_Swift_FLAGS=-target $SWIFT_TARGET" \
            "-DDESKTOP_APP_MAC_ARCH=$ARCHITECTURE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            '-DCMAKE_CXX_FLAGS=-Xclang -fno-pch-timestamp' \
            '-DCMAKE_OBJCXX_FLAGS=-Xclang -fno-pch-timestamp' \
            "-DTDESKTOP_API_ID=$TDESKTOP_API_ID" \
            "-DTDESKTOP_API_HASH=$TDESKTOP_API_HASH" \
            -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          python3 build/check_macos_release.py ../out --architectures "$ARCHITECTURE"
          while :; do
            printf '%s swap=%s pageouts=%s\n' \
              "$(date -u +%H:%M:%S)" \
              "$(sysctl -n vm.swapusage | sed -n 's/.*used = \([0-9.]*\)M.*/\1/p')" \
              "$(vm_stat | sed -n 's/^Pageouts: *\([0-9]*\)\./\1/p')"
            sleep 60 & wait $!
          done > "$RUNNER_TEMP/memory.log" 2>&1 &
          sampler=$!
          trap 'kill "$sampler" 2> /dev/null || true' EXIT
          cmake --build ../out --parallel 3 --target Telegram
          mkdir -p "../mac-apps/$ARCHITECTURE"
          ditto ../out/AyuGram.app "../mac-apps/$ARCHITECTURE/AyuGram.app"
          tar -C ../mac-apps -cf "../mac-apps/$ARCHITECTURE.tar" "$ARCHITECTURE"
      - name: Build statistics
        if: always()
        continue-on-error: true
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          ccache --show-stats -v || true
          python3 AyuGramDesktop/Telegram/build/ninja_log_stats.py AyuGramDesktop/out/.ninja_log \
            --title "macOS $ARCHITECTURE Release" --markdown-file "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "<details><summary>macOS $ARCHITECTURE compiler cache and memory</summary>"
            echo
            echo '```'
            ccache --show-stats -v || true
            echo
            awk '{ last = $0
                   for (i = 1; i <= NF; i++) if ($i ~ /^swap=/) { v = substr($i, 6) + 0; if (v >= peak) { peak = v; line = $0 } } }
                 END { if (NR) print "samples: " NR "\npeak:  " line "\nlast:  " last }' \
              "$RUNNER_TEMP/memory.log" 2> /dev/null || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save compiler cache
        # Saved even when the build failed: a retry then resumes from the
        # objects this run did produce instead of recompiling everything.
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Drop superseded compiler caches
        continue-on-error: true
        env:
          KEEP: |
            ${{ steps.compiler-cache.outputs.cache-primary-key }}
          PREFIXES: ccache-macos-${{ matrix.architecture }}-release-
        run: |
          # Kept under ten gigabytes by deleting what each save superseded,
          # right after that save rather than at the end of the job.
          for prefix in $PREFIXES; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json key --jq '.[].key' |
              grep -vxF "$KEEP" | while read -r key; do gh cache delete --repo "$GITHUB_REPOSITORY" "$key"; done || true
          done
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ matrix.architecture }}
          path: AyuGramDesktop/mac-apps/${{ matrix.architecture }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos:
    name: macOS universal Release
    needs: [validate, macos-build]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-app-*
          path: mac-apps
          merge-multiple: true
      - name: Verify app and create DMG
        run: |
          trap 'echo "macOS packaging failed at line $LINENO." >&2' ERR
          tar -C mac-apps -xf mac-apps/arm64.tar
          tar -C mac-apps -xf mac-apps/x86_64.tar
          app=release/AyuGram.app
          arm=mac-apps/arm64/AyuGram.app
          intel=mac-apps/x86_64/AyuGram.app
          rm -rf release dmg artifacts
          mkdir -p release
          ditto "$arm" "$app"
          if [[ ! -s "$app/Contents/MacOS/AyuGram" ]]; then
            echo 'AyuGram executable is missing after copying the arm64 bundle.' >&2
            find "$app/Contents" -maxdepth 3 -print >&2
            exit 1
          fi
          while IFS= read -r -d '' arm_file; do
            if ! file "$arm_file" | grep -q 'Mach-O'; then continue; fi
            relative=${arm_file#"$arm/"}
            intel_file="$intel/$relative"
            output="$app/$relative"
            test -f "$intel_file"
            arm_archs=" $(lipo -archs "$arm_file") "
            intel_archs=" $(lipo -archs "$intel_file") "
            if [[ "$arm_archs" == *' arm64 '* && "$arm_archs" == *' x86_64 '* ]]; then
              continue
            fi
            if [[ "$relative" == Contents/Frameworks/libswift*.dylib && "$arm_archs" == "$intel_archs" ]]; then
              if [[ "$arm_archs" != *' x86_64 '* ]]; then
                echo "Unsupported matching Swift fallback architectures for $relative:$arm_archs" >&2
                exit 1
              fi
              continue
            fi
            [[ "$arm_archs" == *' arm64 '* && "$intel_archs" == *' x86_64 '* ]]
            lipo -create "$arm_file" "$intel_file" -output "$output"
          done < <(find "$arm" -type f -print0)
          while IFS= read -r -d '' output_file; do
            if ! file "$output_file" | grep -q 'Mach-O'; then continue; fi
            relative=${output_file#"$app/"}
            output_archs=" $(lipo -archs "$output_file") "
            if [[ "$relative" == Contents/Frameworks/libswift*.dylib ]]; then
              if [[ "$output_archs" != *' x86_64 '* ]]; then
                echo "Swift fallback $relative has unsupported architectures:$output_archs" >&2
                exit 1
              fi
              continue
            fi
            [[ "$output_archs" == *' arm64 '* && "$output_archs" == *' x86_64 '* ]]
          done < <(find "$app" -type f -print0)
          if [[ ! -s "$app/Contents/MacOS/AyuGram" ]]; then
            echo 'AyuGram executable is missing after merging the bundles.' >&2
            find "$app/Contents" -maxdepth 3 -print >&2
            exit 1
          fi
          test -s "$app/Contents/Resources/Telegram.rcc"
          test -s "$app/Contents/Resources/AppIcon-Default.icns"
          test "$(lipo -archs "$app/Contents/MacOS/AyuGram" | tr ' ' '\n' | sort | tr '\n' ' ')" = 'arm64 x86_64 '
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = one.ayugram.AyuGramDesktop
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")" = "$VERSION"
          icon_name=$(plutil -extract CFBundleIconFile raw -o - "$app/Contents/Info.plist")
          test -s "$app/Contents/Resources/$icon_name"
          test ! -e "$app/Contents/Frameworks/Updater"
          /usr/bin/strip -S "$app/Contents/MacOS/AyuGram"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app"
          mkdir -p dmg artifacts
          ditto "$app" dmg/AyuGram.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname AyuGram -srcfolder dmg -ov -format UDZO artifacts/AyuGram.dmg
          mkdir "$RUNNER_TEMP/ayugram-mount"
          device=$(hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/ayugram-mount" artifacts/AyuGram.dmg | awk '/^\/dev\// { print $1; exit }')
          test -n "$device"
          trap 'hdiutil detach "$device"' EXIT
          test -s "$RUNNER_TEMP/ayugram-mount/AyuGram.app/Contents/MacOS/AyuGram"
          codesign --verify --deep --strict "$RUNNER_TEMP/ayugram-mount/AyuGram.app"
          test "$(lipo -archs "$RUNNER_TEMP/ayugram-mount/AyuGram.app/Contents/MacOS/AyuGram" | tr ' ' '\n' | sort | tr '\n' ' ')" = 'arm64 x86_64 '
          hdiutil detach "$device"
          trap - EXIT
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: artifacts/AyuGram.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows:
    name: Windows x64 Release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
      # The runner image leaves about 25 GB free on C:, which a Release build
      # does not fit into; the workspace drive is 150 GB and all but empty.
      TBUILD: ${{ github.workspace }}\TBuild
      SRC: ${{ github.workspace }}\TBuild\AyuGramDesktop
      CCACHE_DIR: ${{ github.workspace }}\TBuild\ccache
      CCACHE_BASEDIR: ${{ github.workspace }}\TBuild
      CCACHE_DEPEND: 'true'
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          submodules: recursive
          path: TBuild/AyuGramDesktop
          persist-credentials: false
      - name: Read toolchain and cache key
        id: toolchain
        shell: bash
        run: |
          sdk=$(sed -n 's/.*\*\*\([^*]*\)\*\* SDK version.*/\1/p' "$SRC/docs/building-win.md" | head -1)
          test -n "$sdk"
          # prepare.py keys every stage by its absolute build root, so a cache
          # keyed without it hits while every stage inside it misses.
          key=$( { sha256sum "$SRC/Telegram/build/prepare/prepare.py"; printf '%s\n%s\n' "$sdk" "$TBUILD"; } | sha256sum | cut -d' ' -f1)
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Install Visual Studio ATL component
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $path) { throw "No Visual Studio instance provides $toolsComponent." }
          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory |
            Where-Object { $_.Name -like '14.44.*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (-not (Test-Path $header)) {
            $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$path`"", '--add', $atlComponent,
              '--quiet', '--norestart', '--nocache')
            if ($process.ExitCode -notin @(0, 3010)) { exit $process.ExitCode }
          }
          if (-not (Test-Path $header)) { throw "ATL was not installed at $header." }
      - name: Native Tools Command Prompt
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ steps.toolchain.outputs.sdk }}
          toolset: '14.44'
      - name: Install the compiler cache
        run: |
          choco install ccache --version=4.14.0 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ccache --version
      - name: Restore ThirdParty cache
        id: third-party-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: windows-x64-third-party-${{ steps.toolchain.outputs.key }}
          restore-keys: windows-x64-third-party-
      - name: Restore libraries cache
        id: libraries-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\Libraries\win64
          key: windows-x64-release-libraries-${{ steps.toolchain.outputs.key }}
          restore-keys: windows-x64-release-libraries-
      - name: Prepare libraries
        shell: cmd
        run: call %SRC%\Telegram\build\prepare\win.bat silent qt-release-only
      - name: Strip unused library files
        shell: bash
        run: |
          find "$TBUILD/Libraries/win64" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
          # The disk is what a from-source build runs into, and
          # the step summary needs a login to read.
          df -h
      - name: Save ThirdParty cache
        if: steps.third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}
      - name: Save libraries cache
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\Libraries\win64
          key: ${{ steps.libraries-cache.outputs.cache-primary-key }}
      - name: Drop superseded dependency caches
        continue-on-error: true
        shell: bash
        env:
          KEEP: |
            ${{ steps.third-party-cache.outputs.cache-primary-key }}
            ${{ steps.libraries-cache.outputs.cache-primary-key }}
          PREFIXES: 'windows-x64-third-party- windows-x64-release-libraries-'
        run: |
          # Kept under ten gigabytes by deleting what each save superseded,
          # right after that save rather than at the end of the job.
          for prefix in $PREFIXES; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json key --jq '.[].key' |
              grep -vxF "$KEEP" | while read -r key; do gh cache delete --repo "$GITHUB_REPOSITORY" "$key"; done || true
          done
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ccache
          key: ccache-windows-x64-release-${{ needs.validate.outputs.sha }}
          restore-keys: ccache-windows-x64-release-
      - name: Configure Release
        shell: cmd
        env:
          API_ID: ${{ vars.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          ccache --zero-stats
          echo NUMBER_OF_PROCESSORS=%NUMBER_OF_PROCESSORS%
          cd /d %SRC%\Telegram
          call configure.bat -G "Ninja Multi-Config" ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON ^
            "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=" ^
            -D CMAKE_C_COMPILER_LAUNCHER=ccache ^
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -D "TDESKTOP_API_ID=%API_ID%" ^
            -D "TDESKTOP_API_HASH=%API_HASH%" ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
      - name: Verify Release configuration
        run: |
          $out = Join-Path $env:SRC 'out'
          $cache = @{}
          Get-Content (Join-Path $out 'CMakeCache.txt') | ForEach-Object {
            if ($_ -match '^([^:#/][^:=]*):[^=]+=(.*)$') { $cache[$Matches[1]] = $Matches[2] }
          }
          if ($cache['CMAKE_CONFIGURATION_TYPES'] -ne 'Release') { throw 'Not a Release-only build.' }
          if ($cache['DESKTOP_APP_DISABLE_AUTOUPDATE'] -ne 'ON') { throw 'Updater is enabled.' }
          if ($cache['CMAKE_C_COMPILER_LAUNCHER'] -ne 'ccache' -or $cache['CMAKE_CXX_COMPILER_LAUNCHER'] -ne 'ccache') {
            throw 'Compiler cache is not wired into the build.'
          }
          $commands = Get-Content (Join-Path $out 'compile_commands.json') -Raw
          if ($commands -notmatch 'Telegram[/\\]SourceFiles' -or $commands -notmatch '(/O2|-O2)' -or $commands -notmatch 'NDEBUG') {
            throw 'Release compilation flags were not generated.'
          }
          if ($commands -match ' /Z(7|i) ') { throw 'Release objects include debug information.' }
      - name: Build AyuGram
        shell: cmd
        run: cmake --build %SRC%\out --config Release --parallel --target Telegram
      - name: Build statistics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ccache --show-stats -v || true
          df -h || true
          python "$SRC/Telegram/build/ninja_log_stats.py" "$SRC/out/.ninja_log" \
            --title 'Windows x64 Release' --markdown-file "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '<details><summary>Windows compiler cache and disk</summary>'
            echo
            echo '```'
            ccache --show-stats -v || true
            echo
            df -h || true
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save compiler cache
        # Saved even when the build failed: a retry then resumes from the
        # objects this run did produce instead of recompiling everything.
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Drop superseded compiler caches
        continue-on-error: true
        shell: bash
        env:
          KEEP: |
            ${{ steps.compiler-cache.outputs.cache-primary-key }}
          PREFIXES: ccache-windows-x64-release-
        run: |
          # Kept under ten gigabytes by deleting what each save superseded,
          # right after that save rather than at the end of the job.
          for prefix in $PREFIXES; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json key --jq '.[].key' |
              grep -vxF "$KEEP" | while read -r key; do gh cache delete --repo "$GITHUB_REPOSITORY" "$key"; done || true
          done
      - name: Verify and package Windows artifacts
        run: |
          $out = Join-Path $env:SRC 'out\Release'
          $binary = Join-Path $out 'AyuGram.exe'
          if (-not (Test-Path $binary)) { throw 'AyuGram.exe was not built.' }
          if (Test-Path (Join-Path $out 'Updater.exe')) { throw 'Updater.exe must not be built.' }
          $stream = [IO.File]::OpenRead($binary)
          try {
            $reader = [IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $pe = $reader.ReadInt32()
            $stream.Position = $pe + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $stream.Dispose()
          }
          if ($machine -ne 0x8664) { throw "Unexpected PE machine: 0x$($machine.ToString('x4'))." }
          $version = (Get-Item $binary).VersionInfo.ProductVersion
          if ($version -ne "$env:VERSION.0") { throw "Unexpected product version: $version." }
          $signature = Get-AuthenticodeSignature $binary
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected application signature status: $($signature.Status)." }
          $d3d = Join-Path $out 'modules\x64\d3d\d3dcompiler_47.dll'
          if (-not (Test-Path $d3d)) { throw 'D3D compiler module is missing.' }
          if (-not (Test-Path (Join-Path $env:SRC 'Telegram\Resources\art\icon256.ico'))) { throw 'Windows application icon is missing.' }
          choco install innosetup --version=6.7.1 --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/dMyAppVersion=$env:VERSION" "/dMyAppVersionZero=$env:VERSION" "/dMyAppVersionFull=$env:VERSION" "/dReleasePath=$out" '/dMyBuildTarget=win64' '/dAyuGramUnsigned=1' '/dAyuGramNoUpdater=1' (Join-Path $env:SRC 'Telegram\build\setup.iss')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $out "ayusetup-x64.$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw 'Installer was not created.' }
          if ((Get-AuthenticodeSignature $setup).Status -ne 'NotSigned') { throw 'Unexpected installer signature.' }
          $artifacts = Join-Path $env:SRC 'artifacts'
          New-Item -ItemType Directory -Force $artifacts | Out-Null
          Copy-Item $setup (Join-Path $artifacts 'AyuGram.exe')
          $portable = Join-Path $env:RUNNER_TEMP 'AyuGram'
          New-Item -ItemType Directory -Force (Join-Path $portable 'TelegramForcePortable') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $portable 'modules\x64\d3d') | Out-Null
          Copy-Item $binary (Join-Path $portable 'AyuGram.exe')
          Copy-Item $d3d (Join-Path $portable 'modules\x64\d3d\d3dcompiler_47.dll')
          & 7z a -mx9 (Join-Path $artifacts 'AyuGram.zip') $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 7z t (Join-Path $artifacts 'AyuGram.zip')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $env:RUNNER_TEMP 'installed-AyuGram'
          $process = Start-Process (Join-Path $artifacts 'AyuGram.exe') -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install")
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Test-Path (Join-Path $install 'AyuGram.exe'))) { throw 'Installed application is missing.' }
          if (Test-Path (Join-Path $install 'Updater.exe')) { throw 'Installer included the updater.' }
          if (-not (Test-Path (Join-Path $install 'modules\x64\d3d\d3dcompiler_47.dll'))) { throw 'Installer omitted the D3D module.' }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            ${{ env.SRC }}\artifacts\AyuGram.exe
            ${{ env.SRC }}\artifacts\AyuGram.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [validate, source, macos, windows]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
      SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify files and checksums
        run: |
          cd release
          expected=(AyuGram.dmg AyuGram.exe AyuGram.zip "AyuGramDesktop-$VERSION-full.tar.gz")
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          for file in "${expected[@]}"; do test -s "$file"; done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish exact-head release
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Technical maintenance build of AyuGram $VERSION from commit \`$SHA\`.

          - \`AyuGram.dmg\`: universal macOS application (Apple Silicon and Intel)
          - \`AyuGram.exe\`: Windows x64 installer
          - \`AyuGram.zip\`: Windows x64 portable application
          - \`AyuGramDesktop-$VERSION-full.tar.gz\`: source with pinned submodules

          Automatic updates are disabled. The macOS application has an ad-hoc
          integrity signature and is not notarized. Windows binaries are not
          Authenticode-signed. Verify downloads with \`SHA256SUMS.txt\`.
          NOTES
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "AyuGram $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
